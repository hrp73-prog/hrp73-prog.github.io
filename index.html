<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harsh Patel</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #10283d;
        background: #b9ddf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(2rem, 8vw, 5.5rem);
        border: 1px solid #a8cbe4;
        border-radius: 1.25rem;
        background: #f8fbff;
        box-shadow: 0 24px 70px rgb(29 45 57 / 8%);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #17649a;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.75rem, 9vw, 5rem);
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .intro {
        max-width: 34rem;
        margin: 1.5rem 0 0;
        color: #52616b;
        font-size: clamp(1.05rem, 2.6vw, 1.25rem);
        line-height: 1.75;
      }

      .rule {
        width: 3rem;
        height: 3px;
        margin-top: 2.5rem;
        border: 0;
        background: #17649a;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Student · Newark, NJ</p>
      <h1>Harsh Patel</h1>
      <p class="intro">I'm a student at NJIT, studying Construction Engineering.</p>
      <hr class="rule">
    </main>
  </body>
</html>
